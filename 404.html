    font-weight: 400;

    margin: 0 0 1.25rem;

  .byline { font-size: 1.0625rem; margin: 0; }
  h2 {
    font-size: 1.0625rem;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    font-weight: 600;
    color: var(--quiet);
    margin: 4.5rem 0 1.5rem;
  }
  p { max-width: var(--measure); margin: 0 0 1.25rem; }
  a { color: inherit; text-decoration-color: var(--rule); text-underline-offset: 0.2em; }
  a:hover { text-decoration-color: var(--ink); }
  .links { list-style: none; margin: 0; padding: 0; max-width: var(--measure); }
  .links li { margin: 0 0 0.35rem; }
